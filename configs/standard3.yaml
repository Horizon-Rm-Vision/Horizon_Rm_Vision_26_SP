camera_name: "daheng"
exposure_ms: 3
gamma: 2.85
vid_pid: "KE0200010097"


#  1  0  0
#  0  1  0
#  0  0  1
R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]

