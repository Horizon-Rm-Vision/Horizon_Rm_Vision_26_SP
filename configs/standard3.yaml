#enemy_color: auto #auto表示根据gimbal发送的模式自动判断敌我颜色，非auto表示固定敌我颜色
enemy_color: "red"
#enemy_color: "blue"

#####-----神经网络参数-----#####
yolo_name: yolov5_trt
classify_model: ../assets/tiny_resnet.onnx
yolo11_model_path: ../assets/yolo11.xml
yolov8_model_path: ../assets/yolov8.xml
yolov5_model_path: ../assets/yolov5.xml
yolov5_trt_model_path: ../assets/yolov5a-fp16-ampere.engine
#yolov5_trt_model_path: ../assets/yolov5a-fp16-orin.engine
#yolov5_trt_model_path: ../assets/yolov5a-fp16-ada.engine
device: CPU
min_confidence: 0.8
use_traditional: true

#####-----ROI-----#####
roi: 
  x: 420
  y: 50
  width: 600
  height: 600

use_roi: false

#####-----传统方法参数-----#####
threshold: 150
max_angle_error: 45 # degree
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25 # degree

#####-----tracker参数-----#####
min_detect_count: 5
max_temp_lost_count: 40 #15

#####-----outpost参数-----#####
outpost_max_temp_lost_count: 75 #75
outpost_min_detect_count: 3
outpost_detect_fail_tolerance: 8
outpost_correction_enable: true
outpost_correction_min_detect_count: 3
outpost_correction_cancel_count: 5
outpost_h_max_reasonable: 0.25
outpost_match_gate: 10.0
outpost_q_h: 0.0006
outpost_h_converged_variance: 0.05
outpost_converged_pos_p_max: 0.5
outpost_converged_vel_p_max: 10.0

#####-----弹道手动校正参数-----#####
yaw_offset: 0 # degree -2.5 #正值枪口向左
pitch_offset: 0 # degree 2 #正值枪口向上

#####-----aimer参数-----#####
comming_angle: 30 # degree (调小，只考虑很接近中心的装甲板)
leaving_angle: 10 # degree (调小，更谨慎切换)
decision_speed: 0.5 #8 # rad/s (调大，不容易进入小陀螺模式，使用角度差最小选择逻辑)
high_speed_delay_time: 0.015 # s
low_speed_delay_time: 0.015 # s 
gyro_angle_threshold: 60 # degree
gyro_speed_threshold: 2 # rad/s

#####-----开火约束参数-----#####
gimbal_yaw_threshold: 30 # degree, 云台yaw角度约束阈值
target_distance_threshold: 5 # meter, 目标距离约束阈值

#####-----shooter参数-----#####
first_tolerance: 3 # 近距离射击容差，degree
second_tolerance: 2 # 远距离射击容差，degree
judge_distance: 2 #距离判断阈值
auto_fire: true # 是否由自瞄控制射击

#####-----planner-----#####
fire_thresh: 0.0035

max_yaw_acc: 50 #50
Q_yaw: [9e6, 0]
R_yaw: [1]

# max_pitch_acc: 100
max_pitch_acc: 100
Q_pitch: [9e6, 0]
R_pitch: [1]

#####-----gimbal参数-----#####
com_port: /dev/pts/7

