enemy_color: "red"
#enemy_color: "blue"

#####-----神经网络参数-----#####
yolo_name: yolov5_trt
classify_model: ../assets/tiny_resnet.onnx
yolo11_model_path: ../assets/yolo11.xml
yolov8_model_path: ../assets/yolov8.xml
yolov5_model_path: ../assets/yolov5.xml
yolov5_trt_model_path: ../assets/yolov5a.engine
#yolov5_trt_model_path: ../assets/yolov5a-fp16-orin.engine
#yolov5_trt_model_path: ../assets/yolov5a-fp16-ada.engine
device: CPU
min_confidence: 0.8
use_traditional: true

#####-----ROI-----#####
roi: 
  x: 420
  y: 50
  width: 600
  height: 600

use_roi: false

#####-----传统方法参数-----#####
threshold: 150
max_angle_error: 45 # degree
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25 # degree

#####-----tracker参数-----#####
min_detect_count: 5
max_temp_lost_count: 40
outpost_max_temp_lost_count: 75

#####-----aimer参数-----#####
yaw_offset: 0 # degree -2.5
pitch_offset: 0 # degree 2
comming_angle: 60 # degree
leaving_angle: 20 # degree
decision_speed: 0.1 #8 # rad/s 判定是否小陀螺的速度阈值
high_speed_delay_time: 0.030 # s
#low_speed_delay_time: 0.015 # s planner use this value
low_speed_delay_time: 0.060 # s planner use this value

#####-----shooter参数-----#####
first_tolerance: 3 # 近距离射击容差，degree
second_tolerance: 2 # 远距离射击容差，degree
judge_distance: 2 #距离判断阈值
auto_fire: true # 是否由自瞄控制射击

#####-----锁车中心参数-----#####
aim_center: true # 锁车中心
armor_yaw_threshold: 20 # 锁车时装甲板yaw角度阈值，degree

#####-----相机参数-----#####
camera_name: "mindvision"
exposure_ms: 6
gamma: 3 #已经废弃
vid_pid: "f622:d13a"

# camera_name: "hikrobot"
# exposure_ms: 3
# gain: 10.0
# vid_pid: "2bdf:0001"

# camera_name: "daheng"
# exposure_ms: 2
# gamma: 2.85
# vid_pid: "KE0200010097"


#  1  0  0
#  0  1  0
#  0  0  1
R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]

