predict_time: 0.120     # s

# 弹道解算模式，可选 "no_drag" (默认抛物线) 或 "hero" (带空气阻力迭代)
ballistic_model: "no_hero"

#####-----EZ filter parameters-----####
# 下面参数用于对发送给电控的yaw/pitch数据进行简单突变过滤。
# 可以在运行时修改这些值来调节行为。
filter:
  enabled: false        # 是否启用滤波器
  m: 30                # 记忆历史帧数量上限
  n: 3                 # 与最近n帧平均值比较
  d_degree: 20        # 与平均值差异阈值（度）
  x: 3                 # 连续帧判定阈值，用于回溯或确认异常

#####-----nav速度倍数（仅用于哨兵模式，导航相关）-----#####
