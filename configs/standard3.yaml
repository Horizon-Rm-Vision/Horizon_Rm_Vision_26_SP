#####-----buff_detector参数-----#####
model: "../assets/yolo11_buff_int8.xml"

#####-----buff_aimer参数-----#####
fire_gap_time: 0.700   # s
predict_time: 0.120     # s

# 弹道解算模式，可选 "no_drag" (默认抛物线) 或 "hero" (带空气阻力迭代)
ballistic_model: "khero"

#####-----nav速度倍数（仅用于哨兵模式，导航相关）-----#####
velocity_n: 30

#####-----锁车中心参数-----#####
aim_center: false # 锁车中心
aim_center_min_distance: 100 # 触发锁车中心机制的最小距离，单位m，当装甲板距离车中心大于该值时优先锁定车中心点
armor_yaw_threshold: 10 # 锁车时装甲板yaw角度阈值，degree

