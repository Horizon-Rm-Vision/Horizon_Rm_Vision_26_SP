enemy_color: auto #auto表示根据gimbal发送的模式自动判断敌我颜色，非auto表示固定敌我颜色
#enemy_color: "red"
#enemy_color: "blue"

#####-----自瞄神经网络模式参数-----#####
yolo_name: yolov5_ov
classify_model: ../assets/tiny_resnet.onnx
yolo11_model_path: ../assets/yolo11.xml
yolov8_model_path: ../assets/yolov8.xml
yolov5_model_path: ../assets/yolov5.xml
yolov5_trt_model_path: ../assets/yolov5a-fp16-ampere.engine
#yolov5_trt_model_path: ../assets/yolov5a-fp16-orin.engine
#yolov5_trt_model_path: ../assets/yolov5a-fp16-ada.engine
yolox_ov_model_path: ../assets/best_06_02.xml
yolox_trt_model_path: ../assets/best_06_02-fp16-ampere.engine
#yolox_trt_model_path: ../assets/best_06_02-fp16-orin.engine
yolox_svm_model_path: ../assets/svm_numbers_rbf.xml
device: CPU
min_confidence: 0.6
use_traditional: true

#####-----yolox模式标签修正(ov/trt)-----#####
yolox:
  # 标签修正模式: "svm" (华科原版HOG+SVM,目前看效果最好)
  #"lenet" (中南传统的LeNet)
  #"resnet" (traditional_cv模式ResNet) 
  #"none" 或不填则禁用标签修正
  label_correction_mode: "svm"
  # LeNet模式参数 (label_correction_mode: "lenet" 时生效)
  lenet_model_path: "../assets/lenet.onnx"
  lenet_label_path: "../assets/label.txt"
  lenet_threshold: 0.5
  # ResNet模式参数 (label_correction_mode: "resnet" 时生效)
  resnet_model_path: "../assets/tiny_resnet.onnx"

#####-----ROI-----#####
roi: 
  x: 420
  y: 50
  width: 600
  height: 600

use_roi: false

#####-----自瞄神经网络模式传统方法参数(仅yolov5_trt yolov5_ov和yolox_trt yolox_ov可用)-----#####
threshold: 150
max_angle_error: 45 # degree
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25 # degree

#####-----自瞄传统视觉模式识别参数 (yolo_name: tra)-----#####
traditional:
  binary_thres: 90
  use_pca: true      # 使用PCA算法矫正灯条角点
  light:
    min_ratio: 0.0001
    max_ratio: 1.0
    max_angle: 40.0
    color_diff_thresh: 20
  armor:
    min_light_ratio: 0.8
    min_small_center_distance: 0.8
    max_small_center_distance: 3.5
    min_large_center_distance: 3.5
    max_large_center_distance: 8.0
    max_angle: 35.0
  classifier:
    model_path: ../assets/lenet.onnx
    label_path: ../assets/label.txt
    threshold: 0.7
    ignore_classes: ["negative"]


#####-----tracker参数-----#####
min_detect_count: 5
max_temp_lost_count: 40 #15

#####-----outpost参数-----#####
outpost_max_temp_lost_count: 75 #75
outpost_min_detect_count: 3
outpost_detect_fail_tolerance: 8
outpost_correction_enable: true
outpost_correction_min_detect_count: 3
outpost_correction_cancel_count: 5
outpost_h_max_reasonable: 0.25
outpost_match_gate: 10.0
outpost_q_h: 0.0006
outpost_h_converged_variance: 0.05
outpost_converged_pos_p_max: 0.5
outpost_converged_vel_p_max: 10.0
outpost_top_plate_fire_disable: false #启用时将禁止击打最高位前哨站装甲板(用于英雄)
#飞机前哨站优先机制,启用宏并在yaml里启用后会将前哨站装甲板识别和追踪优先级设为最高 
outpost_highest_priority_enable: true  # 前哨站优先级最高，高于其他所有装甲板
#飞机前哨站定时过滤机制,启用宏并在yaml里设置时间后会在一定时间内在识别层过滤其他非前哨站装甲板
outpost_only_duration: 270.0  # 启动后仅识别前哨站的时间窗口(秒)，0=关闭

#####-----outpost 顶部装甲板过滤机制(仅用于无人机)-----#####
#该机制用于前哨站顶部装甲板,过滤大于outpost_top_pitch的装甲板,保留小于outpost_front_pitch的装甲板
#而介于outpost_top_pitch和outpost_front_pitch之间的装甲板为模糊地带
#取两个角度的中间位置为分界,靠近哪个角度就归类为那个角度的行为,所有角度为世界坐标系下角度
#大致可以简化理解为:被过滤的角度<(outpost_top_pitch+outpost_front_pitch)/2<不被过滤的角度
outpost_top_pitch: 27.5 
outpost_front_pitch: -15.0 

#####-----弹道手动校正参数-----#####
yaw_offset: -0.5 # degree -2.5 #正值枪口向左
pitch_offset: 1 # degree 2 #正值枪口向上

#####-----aimer参数-----#####
comming_angle: 30 # degree (调小，只考虑很接近中心的装甲板)
leaving_angle: 10 # degree (调小，更谨慎切换)
decision_speed: 0.5 #8 # rad/s (调大，不容易进入小陀螺模式，使用角度差最小选择逻辑)
high_speed_delay_time: 0.015 # s
low_speed_delay_time: 0.015 # s 
gyro_angle_threshold: 60 # degree
gyro_speed_threshold: 2 # rad/s

#####-----开火约束参数-----#####
gimbal_yaw_threshold: 60 # degree, 云台yaw角度约束阈值
target_distance_threshold: 10 # meter, 目标距离约束阈值

#####-----锁中心参数-----#####
track_center: false  # 是否启用锁中心模式
aim_center_palstance_threshold: 6.5  # 锁中心角速度阈值，弧度制
switch_trackmode_threshold: 1.2  # 切换锁中心模式的角速度偏移，弧度制
aim_center_angle_tolerance: 1  # 锁中心自动击发角度容差，角度制

#####-----shooter参数-----#####
first_tolerance: 3 # 近距离射击容差，degree
second_tolerance: 2 # 远距离射击容差，degree
judge_distance: 2 #距离判断阈值
auto_fire: true # 是否由自瞄控制射击

#####-----planner-----#####
fire_thresh: 0.0035

max_yaw_acc: 50 #50
Q_yaw: [9e6, 0]
R_yaw: [1]

# max_pitch_acc: 100
max_pitch_acc: 100
Q_pitch: [9e6, 0]
R_pitch: [1]

#####-----gimbal参数-----#####
com_port: auto

# #####-----相机参数-----#####
# camera_name: "mindvision"
# exposure_ms: 3
# gamma: 3 #已经废弃
# vid_pid: "f622:d13a"

camera_name: "hikrobot"
exposure_ms: 3
gain: 10.0
vid_pid: "2bdf:0001"

# camera_name: "daheng"
# exposure_ms: 10
# gamma: 2.85
# vid_pid: "KE0200010097"

camera_param_path: ../configs/camera_param/HIK_SENTRY_UC_8MM.yaml

#####-----BUFF神经网络参数-----#####
model: ../assets/yolo11_buff_int8.xml  # YOLO11 buff检测模型路径
yolox_model: ../assets/yolox_rune_3.6m.xml  
buff_yolox_trt_model_path: ../assets/yolox_rune_3.6m-fp16-ampere.engine  
#buff_yolox_trt_model_path: ../assets/yolox_rune_3.6m-fp16-orin.engine  

#####-----检测器模式-----#####
detector_mode: "yolox_ov"  # 检测器模式: "yolo11" / "yolox_ov" / "yolox_trt"

#####-----buff检测参数-----#####
confidence_threshold: 0.7  # 置信度阈值
iou_threshold: 0.4  # NMS的IOU阈值
lose_max: 20  # 最大丢失帧数

#####-----R标签检测参数（移植自ROS版）-----#####
detect_r_tag: true  # 是否使用传统视觉方法检测R标中心
binary_thresh: 100  # 二值化阈值（用于R标检测）
r_tag_roi_size: 200  # R标ROI窗口大小（像素，正方形边长）

#####-----buff tracker参数-----#####
buff_tracker:
  lost_time_thres: 2.0
  tracking_thres: 5
  match_gate: 15.0
  max_dis_diff: 1.0
  r_yaw_var: 0.01
  r_pitch_var: 0.01
  r_dis_var: 0.5
  r_roll_var: 0.1
  motion_delay_ms: 0
  pose_buffer_size: 200
  # --- BigBuffSelector 参数（仅大符 BIG 模式生效）---
  # miss_threshold: 连续丢失 first blade 的帧数阈值。调小→更快切换追踪last blade，调大→更保守。
  miss_threshold: 12
  # reset_threshold: 两 blade 均丢失帧数阈值，触发完全复位。调小→更快复位，调大→更耐遮挡。
  reset_threshold: 50
  # match_dist: blade 身份匹配的像素距离阈值。调大→更容易匹配但可能误匹配，调小→更严格。
  match_dist: 70.0

#####-----buff_aimer参数-----#####
fire_gap_time: 0.700   # s
predict_time: 0.120     # s

# 弹道解算模式，可选 "no_drag" (默认抛物线) 或 "hero" (带空气阻力迭代)
ballistic_model: "no_drag"

#####-----nav速度倍数（仅用于哨兵模式，导航相关）-----#####
velocity_n: 30


# #####-----UI显示配置-----#####
ui:
  enabled: true
  imshow: true
  web:
    enabled: false
    host: "192.168.1.49"
    port: 9878
    send_image: false
    image_quality: 75
    max_image_dim: 640

#####-----recorder参数-----#####
recorder: false

#####-----弹速参数-----#####
bullet_speed: "auto"
