yaw_kp: 0
yaw_kd: 0
pitch_kp: 0
pitch_kd: 0

#####-----planner-----#####
fire_thresh: 0.0001

# max_yaw_acc: 50
max_yaw_acc: 50
Q_yaw: [9e6, 0]
#Q_yaw: [6e6, 0] #zys 1.18
R_yaw: [1]

# max_pitch_acc: 100
max_pitch_acc: 100
Q_pitch: [9e6, 0]
R_pitch: [1]

