# auto_buff_test.cpp 配置文件
# 用于能量机关（大符）测试

#####-----神经网络参数-----#####
model: ../assets/yolo11_buff_int8.xml  # YOLO11 buff检测模型路径

#####-----相机参数-----#####
image_width: 1280
image_height: 720
fov_h: 57.7  # 水平视场角（度）
fov_v: 56.7  # 垂直视场角（度）

#####-----相机标定参数-----#####
# 云台到IMU本体的旋转矩阵
R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]

# 相机到云台的旋转矩阵
R_camera2gimbal: [0.01928451708725664, 0.00012696140743255463, 0.99981402834802846, -0.99981344688553653, -0.0010834913551969569, 0.019284643459122196, 0.0010857382619952124, -0.99999940496346484, 0.00010604311483339372]

# 相机到云台的平移向量
t_camera2gimbal: [0.13089617453251859, 0.0038468007459533785, 0.094139945222010288]

# 相机内参矩阵
camera_matrix: [2414.9359264386621, 0, 717.26243105567414, 0, 2418.0489262208148, 582.68540529942845, 0, 0, 1]

# 畸变系数
distort_coeffs: [-0.0209453389287673, 0.15028138841073832, -0.0006517722113234505, -0.0016861906197686788, 0]

#####-----aimer参数-----#####
yaw_offset: -0.8  # 偏航偏移（度）
pitch_offset: -1.0  # 俯仰偏移（度）
fire_gap_time: 0.1  # 开火间隔时间（秒）
predict_time: 0.05  # 预测时间（秒）
ballistic_model: "no_drag"  # 弹道模型："hero" 或默认无阻力模型

#####-----buff检测参数-----#####
confidence_threshold: 0.7  # 置信度阈值
iou_threshold: 0.4  # NMS的IOU阈值
lose_max: 20  # 最大丢失帧数

#####-----传统图像处理参数-----#####
threshold: 100  # 二值化阈值
min_lightbar_ratio: 1.5  # 最小灯条长宽比
max_lightbar_ratio: 20  # 最大灯条长宽比
min_lightbar_length: 8  # 最小灯条长度

#####-----调试参数-----#####
show_debug: true  # 显示调试信息
save_result: false  # 保存结果图像
debug_level: 1  # 调试级别 (0:无, 1:基本, 2:详细)
